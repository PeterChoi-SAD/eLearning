version: '3'
services:
  app:
    container_name: eLearning
    restart: always
    build: .
    ports:
      - '5000:3000'
    links:
      - mongo
    environment:
      DB_SERVER: mongo
      PORT: 3000

  mongo:
    container_name: mongodb
    image: mongo:latest
    ports:
      - '27017:27017'
